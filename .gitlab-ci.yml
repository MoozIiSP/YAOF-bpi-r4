# GitLab CI/CD pipeline for building OpenWrt
# This is a conversion from the existing GitHub Actions workflow.

stages:
  - test
  - build
  - package
  - release

.build_template: &build_definition
  stage: build
  allow_failure: true
  image:
    name: ubuntu:24.04
  variables:
    FORCE_UNSAFE_CONFIGURE: "1"
  tags:
    - linux
  before_script:
    - echo "Installing build dependencies..."
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get -qq update
    - apt-get -y -qq --no-install-recommends install software-properties-common apt-transport-https curl ca-certificates
    - add-apt-repository -y ppa:apt-fast/stable
    - apt-get -y -qq update
    - apt-get -y -qq --no-install-recommends install apt-fast
    - apt-fast -y -qq install asciidoc bash bcc bin86 binutils bison bzip2 clang file flex g++ g++-multilib gawk gcc-multilib gettext git gzip help2man intltool libbpf-dev libboost-dev libelf-dev libncurses-dev libssl-dev libthread-queue-any-perl libusb-dev libxml-parser-perl linux-tools-generic llvm make patch perl-modules pkg-config python3-dev python3-pip python3-pyelftools python3-setuptools rsync sharutils swig time unzip util-linux wget xsltproc zlib1g-dev zip zstd dos2unix dwarves jq npm quilt
    - npm install -g pnpm
    - if ! id runner >/dev/null 2>&1; then useradd --create-home --shell /bin/bash runner; fi
    - chown -R runner:runner "$CI_PROJECT_DIR"
    - runuser -u runner -- pip3 install --user -U pylibfdt --break-system-packages
    - apt-get -qq autoremove --purge
    - apt-get -qq clean
    - runuser -u runner -- git config --global user.name 'GitLab CI'
    - runuser -u runner -- git config --global user.email 'noreply@gitlab.com'
    - runuser -u runner -- git config --global core.abbrev auto
    - df -h
  script:
    - |
      runuser -u runner -- env TARGET="$TARGET" SCRIPT_DIR="$SCRIPT_DIR" ARCH="$ARCH" bash <<'EOS'
      set -euo pipefail

      export PATH="/home/runner/.local/bin:$PATH"

      section_start() {
        echo -e "section_start:$(date +%s):$1[collapsed=true]\r$2"
      }

      section_end() {
        echo -e "section_end:$(date +%s):$1\r"
      }

      mkdir -p ci-logs
      LOG_FILE="$PWD/ci-logs/build.log"
      echo "Starting build for $TARGET (logging to $LOG_FILE)"
      echo "GitLab logs over 4MiB are truncated; retrieve ci-logs/build.log artifact if you see 'Job's log exceeded limit of 4194304 bytes.'"

      exec > >(tee -a "$LOG_FILE") 2>&1

      export BUILD_CORES=$(nproc)
      export MAKEFLAGS="-j${BUILD_CORES}"

      section_start free_space "Maximize build space"
      rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      section_end free_space

      section_start mixedwrt "Prepare MixedWrt scripts"
      cp -r "./SCRIPTS/${SCRIPT_DIR}/." ./SCRIPTS/
      cp -r ./SCRIPTS/. ./
      /bin/bash 01_get_ready.sh
      section_end mixedwrt

      section_start packages "Prepare packages"
      cd openwrt
      cp -r ../SCRIPTS/. ./
      /bin/bash 02_prepare_package.sh
      /bin/bash 02_target_only.sh
      /bin/bash 04_remove_upx.sh
      section_end packages

      section_start configure "Configure build"
      cp -rf ../SEED/${TARGET}/config.seed .config
      /bin/bash 03_convert_translation.sh
      /bin/bash 05_create_acl_for_luci.sh -a
      chmod -R 755 ./08_fix_permissions.sh
      /bin/bash 08_fix_permissions.sh
      section_end configure

      section_start compile "Compile firmware"
      make -s defconfig
      make -s -j${BUILD_CORES} download
      make -s -j${BUILD_CORES} package/network/utils/nftables/refresh V=s
      export BUILD_CORES_PLUS_ONE=$((BUILD_CORES + 1))
      retry=0
      MAX_RETRY=10
      until IGNORE_ERRORS=1 make -s -j${BUILD_CORES_PLUS_ONE}; do
        if (( retry >= MAX_RETRY )); then
          echo "Make failed after ${MAX_RETRY} retries; falling back to single-threaded verbose build."
          cat ./.config
          make -j1 V=s
          break
        fi
        echo "Make failed, retrying after refreshing downloads (possible network issue)..."
        make -s -j1 download || true
        retry=$((retry + 1))
      done
      section_end compile

      EOS
  artifacts:
    name: "artifacts-${TARGET}"
    paths:
      - openwrt/bin/
      - ci-logs/build.log
    expire_in: 1 week
    when: always
  cache:
    - key: "cache-${TARGET}"
      paths:
        - openwrt/staging_dir
        - openwrt/build_dir
    - key: "openwrt-dl-${TARGET}"
      paths:
        - openwrt/dl
      policy: pull-push

.matrix_targets: &matrix_targets
  - TARGET: "BPI-R4"
    SCRIPT_DIR: "BPI-R4"
    ARCH: "mediatek/filogic"
  # - TARGET: "BPI-R4-PRO"
  #   SCRIPT_DIR: "BPI-R4-PRO"
  #   ARCH: "mediatek/filogic"

#
# Test Stage Job
#
test-tools:
  parallel:
    matrix: *matrix_targets
  <<: *build_definition
  stage: test
  script:
    - |
      runuser -u runner -- env TARGET="$TARGET" SCRIPT_DIR="$SCRIPT_DIR" ARCH="$ARCH" bash <<'EOS'
      set -euo pipefail

      export PATH="/home/runner/.local/bin:$PATH"

      section_start() {
        echo -e "section_start:$(date +%s):$1[collapsed=true]\r$2"
      }

      section_end() {
        echo -e "section_end:$(date +%s):$1\r"
      }

      mkdir -p ci-logs
      LOG_FILE="$PWD/ci-logs/test-tools.log"
      echo "Starting tool build for $TARGET (logging to $LOG_FILE)"
      echo "GitLab logs over 4MiB are truncated; retrieve ci-logs/test-tools.log artifact if you see 'Job's log exceeded limit of 4194304 bytes.'"

      exec > >(tee -a "$LOG_FILE") 2>&1

      export BUILD_CORES=$(nproc)
      export MAKEFLAGS="-j${BUILD_CORES}"

      section_start free_space "Maximize build space"
      rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      section_end free_space

      section_start mixedwrt "Prepare MixedWrt scripts"
      cp -r "./SCRIPTS/${SCRIPT_DIR}/." ./SCRIPTS/
      cp -r ./SCRIPTS/. ./
      /bin/bash 01_get_ready.sh
      section_end mixedwrt

      section_start packages "Prepare packages"
      cd openwrt
      cp -r ../SCRIPTS/. ./
      /bin/bash 02_prepare_package.sh
      /bin/bash 02_target_only.sh
      /bin/bash 04_remove_upx.sh
      section_end packages

      section_start configure "Configure build"
      cp -rf ../SEED/${TARGET}/config.seed .config
      /bin/bash 03_convert_translation.sh
      /bin/bash 05_create_acl_for_luci.sh -a
      chmod -R 755 ./08_fix_permissions.sh
      /bin/bash 08_fix_permissions.sh
      section_end configure

      section_start compile_tools "Compile requested tools"
      make -s defconfig
      make -s tools/cmake/download
      make -s tools/dwarves/download
      make -s -j${BUILD_CORES} tools/cmake/compile V=s
      make -s -j${BUILD_CORES} tools/dwarves/compile V=s
      section_end compile_tools

      section_start dummy_artifacts "Create dummy build outputs"
      TARGET_LOWER=$(echo "$TARGET" | tr "A-Z" "a-z")
      BIN_DIR="bin/targets/${ARCH}"
      mkdir -p "${BIN_DIR}"
      printf 'dummy ext4 image for %s\n' "$TARGET" > "${BIN_DIR}/openwrt-${TARGET_LOWER}-ext4.img"
      printf 'dummy squashfs image for %s\n' "$TARGET" > "${BIN_DIR}/openwrt-${TARGET_LOWER}-squashfs.img"
      printf 'dummy sysupgrade image for %s\n' "$TARGET" > "${BIN_DIR}/openwrt-${TARGET_LOWER}-sysupgrade.img"
      mkdir -p bin/packages
      section_end dummy_artifacts
      EOS
  artifacts:
    name: "test-artifacts-${TARGET}"
    paths:
      - openwrt/bin/
      - ci-logs/test-tools.log
    expire_in: 1 week
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

#
# Matrix Build Job
#
build:
  parallel:
    matrix: *matrix_targets
  <<: *build_definition
  rules:
    - when: never

package:
  stage: package
  image: ubuntu:24.04
  tags:
    - linux
  parallel:
    matrix: *matrix_targets
  needs:
    - job: test-tools
      artifacts: true
    - job: build
      artifacts: true
      optional: true
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get -qq update
    - apt-get -y -qq --no-install-recommends install curl zip
    - if ! id runner >/dev/null 2>&1; then useradd --create-home --shell /bin/bash runner; fi
    - chown -R runner:runner "$CI_PROJECT_DIR"
    - runuser -u runner -- git config --global user.name 'GitLab CI'
    - runuser -u runner -- git config --global user.email 'noreply@gitlab.com'
    - runuser -u runner -- git config --global core.abbrev auto
  script:
    - |
      runuser -u runner -- env TARGET="$TARGET" ARCH="$ARCH" bash <<'EOS'
      set -euo pipefail

      export PATH="/home/runner/.local/bin:$PATH"

      section_start() {
        echo -e "section_start:$(date +%s):$1[collapsed=true]\r$2"
      }

      section_end() {
        echo -e "section_end:$(date +%s):$1\r"
      }

      mkdir -p ci-logs
      LOG_FILE="$PWD/ci-logs/package.log"
      echo "Packaging artifacts for $TARGET (logging to $LOG_FILE)"

      exec > >(tee -a "$LOG_FILE") 2>&1

      cd openwrt

      section_start artifacts "Package artifacts"
      LATEST_RELEASE=$(curl -s https://github.com/openwrt/openwrt/tags | grep -Eo "v[0-9\\.]+\\-*r*c*[0-9]*.tar.gz" | sed -n '/[2-9][4-9]/p' | sed -n 1p | sed 's/.tar.gz//g' | sed 's/v//g')
      TARGET_LOWER=$(echo "$TARGET" | tr "A-Z" "a-z")
      if [ "$TARGET_LOWER" = "x86" ]; then
        SYSUPGRADE_GLOB="*combined-efi.img*"
        EXT4_ZIP='*ext4-combined*'
        SFS_ZIP='*squashfs-combined*'
      elif [ "$TARGET_LOWER" = "bpi-r4" ]; then
        SYSUPGRADE_GLOB="*bpi-r4*"
        EXT4_ZIP='*bpi-r4*ext4*'
        SFS_ZIP='*bpi-r4*squashfs*'
      else
        SYSUPGRADE_GLOB="*sysupgrade.img*"
        EXT4_ZIP="*$TARGET_LOWER*ext4*"
        SFS_ZIP="*$TARGET_LOWER*squashfs*"
      fi

      rm -rf ../artifact/
      mkdir -p ../artifact/targets ../artifact/packages
      cp -a bin/targets/${ARCH}/. ../artifact/targets/ || true
      if [ -d bin/packages ]; then
        cp -a bin/packages/. ../artifact/packages/
      fi

      pushd ../artifact/targets >/dev/null
      ls -Ahl
      gzip -d *.gz || true
      gzip --best *.img
      sha256sum openwrt*${TARGET_LOWER}* | tee ../${TARGET}-GC404-$(date +%Y-%m-%d)-${LATEST_RELEASE}.sha256sum
      zip ../${TARGET}-GC404-$(date +%Y-%m-%d)-${LATEST_RELEASE}-ext4.zip ${EXT4_ZIP}
      zip ../${TARGET}-GC404-$(date +%Y-%m-%d)-${LATEST_RELEASE}-sfs.zip ${SFS_ZIP}
      popd >/dev/null

      if [ -d ../artifact/packages ]; then
        tar --zstd -cf ../artifact/${TARGET}-GC404-$(date +%Y-%m-%d)-${LATEST_RELEASE}-packages.tar.zst -C ../artifact packages
      fi
      section_end artifacts
      EOS
  artifacts:
    name: "artifacts-${TARGET}"
    paths:
      - artifact/
      - ci-logs/package.log
    expire_in: 1 week
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

release:
  stage: release
  image:
    name: alpine:latest
  tags:
    - linux
  before_script:
    - apk add --no-cache curl unzip
    - \'curl -sL "https://gitlab.com/gitlab-org/release-cli/-/releases/latest/downloads/bin/release-cli-linux-amd64" -o /usr/local/bin/release-cli\'
    - chmod +x /usr/local/bin/release-cli
  needs:
    - job: package
      artifacts: true
  script:
    - |
      set -euo pipefail

      echo "Creating release..."
      for f in artifacts-*.zip; do unzip -o "$f"; done
      ls -R

      LATEST_RELEASE=$(curl -s https://github.com/openwrt/openwrt/tags | grep -Eo "v[0-9\.]+\-*r*c*[0-9]*.tar.gz" | sed -n '/[2-9][4-9]/p' | sed -n 1p | sed 's/.tar.gz//g' | sed 's/v//g')
      ASSET_ARGS=$(find artifact -type f \( -name "*.zip" -o -name "*.sha256sum" -o -name "*.tar.zst" \) -printf "--assets-link '{\"name\":\"%f\",\"filepath\":\"%p\"}' ")

      release-cli create --name "OpenWRT-${LATEST_RELEASE}" --tag-name "${LATEST_RELEASE}" \
        --description "OpenWrt build for multiple targets. Release created by GitLab CI." \
        $ASSET_ARGS
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
